<style>
  :root{
    --band:#11202B;
    --band-ink:#EFEEE5;
    --band-muted:#93A6A2;
    --beam:#F2A93C;
    --paper:#EEF0EA;
    --paper-deep:#E2E6DA;
    --ink:#141F2A;
    --ink-soft:#4B5C67;
    --line:#C7CFC2;
    --accent:#A6650E;
    --accent2:#2B6E7E;
    --card:#FBFAF5;
    --serif:"Playfair Display", Georgia, serif;
    --sans:"PT Sans", system-ui, -apple-system, sans-serif;
    --mono:"PT Mono", "SFMono-Regular", Menlo, monospace;
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  ::selection{background:#D8C7A0;}

  a{color:var(--accent);text-decoration:none;}
  a:hover{text-decoration:underline;text-underline-offset:3px;}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px;}

  .wrap{
    max-width:820px;
    margin:0 auto;
    padding:0 32px 120px;
  }

  /* ---- Language switcher ---- */
  .langbar{
    position:fixed;
    top:20px;
    right:20px;
    z-index:60;
    display:flex;
    align-items:center;
    gap:2px;
    background:rgba(17,32,43,.82);
    backdrop-filter:blur(6px);
    border-radius:3px;
    padding:5px 6px;
    font-family:var(--mono);
  }
  .langbar button{
    appearance:none;
    border:none;
    background:transparent;
    font-family:inherit;
    font-size:.72rem;
    font-weight:400;
    letter-spacing:.06em;
    color:var(--band-muted);
    padding:5px 8px;
    cursor:pointer;
    position:relative;
  }
  .langbar button:hover{color:var(--band-ink);}
  .langbar button.active{color:var(--beam);}
  .langbar button.active::after{
    content:"";
    position:absolute;left:8px;right:8px;bottom:0;height:1px;background:var(--beam);
  }
  @media (max-width:600px){
    .langbar{top:12px;right:12px;}
  }

  /* ---- Header band ---- */
  .band{
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(ellipse 140% 100% at var(--beamx, -30%) -10%, rgba(242,169,60,.24), transparent 55%),
      var(--band);
    color:var(--band-ink);
    padding:96px 32px 40px;
    animation:sweep 3.4s ease-out .2s 1 both;
  }
  @keyframes sweep{
    from{ --beamx:-30%; }
    to{ --beamx:118%; }
  }
  @media (prefers-reduced-motion:reduce){
    .band{animation:none;--beamx:10%;}
  }

  .band-inner{max-width:756px;margin:0 auto;}

  .band-main{
    display:flex;
    align-items:flex-end;
    gap:32px;
  }

  .plate{margin:0;flex-shrink:0;text-align:center;}
  .plate img{
    width:112px;
    height:150px;
    object-fit:cover;
    display:block;
    border:3px solid #E8E4D8;
  }
  .plate figcaption{
    font-family:var(--mono);
    font-size:.6rem;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--band-muted);
    margin-top:9px;
  }

  .band-text{min-width:0;padding-bottom:2px;}

  .topline{
    font-family:var(--mono);
    font-size:.7rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--band-muted);
    margin:0 0 16px;
  }

  .name{
    font-family:var(--serif);
    font-weight:700;
    font-size:clamp(2.6rem, 7vw, 4.3rem);
    line-height:1.05;
    letter-spacing:-.01em;
    margin:0;
    color:var(--band-ink);
    text-wrap:balance;
  }

  .role{
    font-family:var(--serif);
    font-style:italic;
    font-weight:500;
    font-size:clamp(1.1rem, 3.3vw, 1.4rem);
    color:var(--beam);
    margin:12px 0 0;
  }

  /* ---- Lede (contacts + intro, on paper) ---- */
  .lede{padding:32px 0 0;}

  .contacts{
    display:flex;
    flex-wrap:wrap;
    gap:10px 24px;
    margin:0;
    font-size:.92rem;
  }
  .contacts span{color:var(--ink-soft);}

  .intro{
    max-width:64ch;
    color:var(--ink-soft);
    margin:26px 0 0;
    font-size:1.06rem;
  }

  /* ---- Tabs ---- */
  .tabbar{
    display:flex;
    flex-wrap:wrap;
    gap:28px;
    margin-top:44px;
    border-top:1px solid var(--line);
    padding-top:26px;
  }
  .tabbar button{
    appearance:none;
    border:none;
    background:none;
    font-family:var(--mono);
    font-size:.74rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    padding:0 0 14px;
    cursor:pointer;
    position:relative;
  }
  .tabbar button::before{
    content:"§ ";
    color:var(--accent);
  }
  .tabbar button:hover{color:var(--ink);}
  .tabbar button[aria-selected="true"]{color:var(--ink);}
  .tabbar button[aria-selected="true"]::after{
    content:"";
    position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);
  }
  @media (max-width:600px){
    .tabbar{gap:18px;padding-top:20px;margin-top:34px;}
  }

  .tabpanel{
    display:none;
    padding-top:34px;
  }
  .tabpanel.active{
    display:block;
    animation:panelIn .35s ease;
  }
  @keyframes panelIn{
    from{opacity:0;transform:translateY(8px);}
    to{opacity:1;transform:none;}
  }

  .sub-label{
    font-family:var(--mono);
    font-size:.68rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-weight:400;
    margin:36px 0 20px;
  }
  .sub-label:first-child{margin-top:0;}

  .entry{
    display:grid;
    grid-template-columns:1fr auto;
    gap:4px 28px;
    padding-bottom:28px;
    margin-bottom:28px;
    border-bottom:1px solid var(--line);
  }
  .entry:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none;}

  .entry h3{
    font-family:var(--serif);
    font-size:1.28rem;
    font-weight:700;
    margin:0;
    line-height:1.3;
  }
  .entry .place{
    color:var(--accent);
    font-size:.95rem;
    margin:4px 0 0;
  }
  .entry .date{
    font-family:var(--mono);
    color:var(--ink-soft);
    font-size:.82rem;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
    text-align:right;
    padding-top:5px;
  }
  .entry ul{
    grid-column:1 / -1;
    margin:14px 0 0;
    padding:0;
    list-style:none;
    color:var(--ink-soft);
  }
  .entry li{
    position:relative;
    padding-left:20px;
    margin-bottom:8px;
    font-size:.97rem;
  }
  .entry li::before{
    content:"";
    position:absolute;
    left:0;
    top:.7em;
    width:8px;
    height:1px;
    background:var(--accent);
  }
  .entry .detail{
    grid-column:1 / -1;
    margin:10px 0 0;
    color:var(--ink-soft);
    font-size:.97rem;
  }
  .entry .detail em{color:var(--ink);font-style:italic;}

  .entry .workblurb{
    grid-column:1 / -1;
    margin:12px 0 0;
    padding-left:14px;
    border-left:2px solid var(--accent);
    color:var(--ink-soft);
    font-style:italic;
    font-size:.9rem;
  }
  .entry .abstract{
    grid-column:1 / -1;
    margin:10px 0 0;
    color:var(--ink-soft);
    font-size:.94rem;
  }

  /* ---- Experience entry with a photo (reuses the postcard treatment) ---- */
  .entry.has-photo{
    grid-template-columns:140px 1fr auto;
    grid-template-areas:
      "photo title date"
      "photo place blurb";
    gap:6px 24px;
  }
  .entry.has-photo .fest-photo-wrap{grid-area:photo;width:140px;height:140px;}
  .entry.has-photo h3{grid-area:title;}
  .entry.has-photo .place{grid-area:place;margin-top:4px;}
  .entry.has-photo .date{grid-area:date;}
  .entry.has-photo .workblurb{grid-area:blurb;margin-top:0;}
  .entry.has-photo ul{margin-top:20px;}
  @media (max-width:600px){
    .entry.has-photo{
      grid-template-columns:96px 1fr;
      grid-template-areas:
        "photo title"
        "photo place"
        "blurb blurb";
    }
    .entry.has-photo .date{grid-column:2;grid-row:1;text-align:left;}
    .entry.has-photo .fest-photo-wrap{width:96px;height:96px;}
  }

  /* ---- Festival / photo cards ---- */
  .fest-entry{
    display:grid;
    grid-template-columns:140px 1fr auto;
    grid-template-areas:
      "photo title  date"
      "photo place  desc";
    gap:6px 24px;
    align-items:start;
  }
  .fest-photo-wrap{
    grid-area:photo;
    width:140px;
    height:140px;
    flex-shrink:0;
    cursor:zoom-in;
  }
  .fest-entry:nth-child(2) .fest-photo-wrap{--tilt:1.1deg;}
  .fest-entry:nth-child(3) .fest-photo-wrap{--tilt:-0.7deg;}
  .fest-photo-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    border:6px solid var(--card);
    box-shadow:0 10px 22px -8px rgba(20,31,42,.35);
    transform:rotate(var(--tilt,-1.1deg));
    transition:transform .3s ease, box-shadow .3s ease;
  }
  .fest-photo-wrap:hover img{transform:rotate(0deg) scale(1.03);box-shadow:0 14px 28px -8px rgba(20,31,42,.42);}
  .fest-photo-wrap img:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
  .fest-entry .fest-title{grid-area:title;font-family:var(--serif);font-size:1.28rem;font-weight:700;margin:0;line-height:1.3;}
  .fest-entry .date{grid-area:date;}
  .fest-entry .place{
    grid-area:place;
    font-family:var(--mono);
    font-size:.66rem;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:10px 0 0;
  }
  .fest-entry .detail{grid-area:desc;margin-top:4px;}

  @media (max-width:600px){
    .fest-entry{
      grid-template-columns:96px 1fr;
      grid-template-areas:
        "photo title"
        "photo place"
        "desc desc";
    }
    .fest-entry .date{grid-column:2;grid-row:1;text-align:left;}
    .fest-photo-wrap{width:96px;height:96px;}
  }

  /* ---- Lightbox ---- */
  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(17,32,43,.9);
    display:none;
    align-items:center;
    justify-content:center;
    padding:32px;
    z-index:200;
    cursor:zoom-out;
  }
  .lightbox.open{display:flex;}
  .lightbox img{
    max-width:92vw;
    max-height:88vh;
    box-shadow:0 24px 70px rgba(0,0,0,.5);
  }

  /* ---- Skills / interests spec grid ---- */
  .spec-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:22px 28px;
    margin:0;
    padding:0;
    list-style:none;
  }
  .spec-item{
    display:flex;
    gap:13px;
    align-items:flex-start;
  }
  .spec-item svg{
    flex-shrink:0;
    width:22px;
    height:22px;
    margin-top:1px;
    stroke:var(--accent);
    fill:none;
    stroke-width:1.6;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .spec-grid.interests svg{stroke:var(--accent2);}
  .spec-item h4{
    font-family:var(--serif);
    font-weight:600;
    font-size:.98rem;
    margin:0;
    line-height:1.3;
  }
  .spec-item p{
    margin:5px 0 0;
    color:var(--ink-soft);
    font-size:.87rem;
    line-height:1.5;
  }
  @media (max-width:600px){
    .spec-grid{grid-template-columns:1fr;}
  }

  /* ---- Languages ---- */
  .langs{margin:0;padding:0;list-style:none;}
  .lang{
    display:grid;
    grid-template-columns:120px 1fr auto;
    align-items:center;
    gap:18px;
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .lang:last-child{border-bottom:none;}
  .lang .lname{font-weight:700;font-size:1rem;}
  .lang .level{font-family:var(--mono);color:var(--ink-soft);font-size:.82rem;white-space:nowrap;}
  .track{height:2px;background:var(--line);position:relative;}
  .track i{position:absolute;left:0;top:0;height:100%;background:var(--accent);}

  /* ---- Footer ---- */
  footer{
    margin-top:56px;
    border-top:1px solid var(--line);
    padding-top:26px;
    font-family:var(--mono);
    font-size:.7rem;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }

  /* ---- Responsive ---- */
  @media (max-width:600px){
    .wrap{padding:0 22px 80px;}
    .band{padding:76px 22px 32px;}
    .band-main{flex-direction:column;align-items:center;gap:22px;}
    .band-text{text-align:center;}
    .entry{grid-template-columns:1fr;}
    .entry .date{text-align:left;padding-top:6px;order:3;}
    .lang{grid-template-columns:96px 1fr;}
    .lang .level{grid-column:1 / -1;}
    .lang .track{grid-column:1 / -1;}
  }

  @media (prefers-reduced-motion:no-preference){
    .reveal{opacity:0;transform:translateY(12px);animation:rise .7s ease forwards;}
    @keyframes rise{to{opacity:1;transform:none;}}
  }

  .tabbar button:focus-visible,
  .langbar button:focus-visible{
    outline:2px solid var(--beam);
    outline-offset:2px;
  }

  /* ---- Print ---- */
  @media print{
    body{background:#fff;}
    .langbar,.tabbar,.lightbox{display:none !important;}
    .wrap{padding:0 8px;max-width:100%;}
    .band{
      background:none !important;
      animation:none !important;
      color:var(--ink);
      padding:0 0 20px;
    }
    .band-muted,.topline{color:#555 !important;}
    .role{color:var(--ink) !important;}
    .plate img{border-color:#ccc;box-shadow:none;}
    .tabpanel{display:block !important;animation:none !important;opacity:1 !important;transform:none !important;}
    .tabpanel + .tabpanel{margin-top:18px;border-top:1px solid var(--line);padding-top:18px;}
    .entry{break-inside:avoid;}
    .fest-photo-wrap img{box-shadow:none;transform:none !important;}
    a{color:var(--ink);text-decoration:underline;}
  }
</style>
</head>

function applyLang(lang){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.getElementById('topline').textContent = t.topline;
  document.getElementById('name').textContent = t.name;
  document.getElementById('role').textContent = t.role;
  document.getElementById('intro').textContent = t.intro;
  document.getElementById('photo').alt = t.photoAlt;
  document.getElementById('plate-caption').textContent = t.plateCaption;

  document.getElementById('tab-experience').innerHTML = t.labels.experience;
  document.getElementById('tab-education').innerHTML = t.labels.education;
  document.getElementById('tab-skillslang').innerHTML = t.labels.skillslang;
  document.getElementById('tab-festivals').innerHTML = t.labels.festivals;

  document.getElementById('sub-activity').innerHTML = t.labels.activity;
  document.getElementById('sub-skills').innerHTML = t.labels.skills;
  document.getElementById('sub-languages').innerHTML = t.labels.languages;
  document.getElementById('sub-interests').innerHTML = t.labels.interests;

  fillEntry('exp1', t.exp1);
  fillEntry('exp2', t.exp2);

  fillEdu('edu1', t.edu1);
  fillEdu('edu2', t.edu2);

  fillList('activity', t.activity);

  fillLangs(t.langs);

  fillSpecs('skills', t.skills);
  fillSpecs('interests', t.interests);

  fillFest('festA', t.festA);
  fillFest('festB', t.festB);
  fillFest('festC', t.festC);

  document.getElementById('footer-text').textContent = t.footer;

  document.querySelectorAll('.langbar button').forEach(function(b){
    const isActive = b.dataset.lang === lang;
    b.classList.toggle('active', isActive);
    b.setAttribute('aria-pressed', String(isActive));
  });

  try { localStorage.setItem('sb-lang', lang); } catch(e){}
}

function fillEntry(id, data){
  document.getElementById(id + '-title').textContent = data.title.replace(/&rsquo;/g, '’');
  document.getElementById(id + '-place').textContent = data.place;
  document.getElementById(id + '-date').textContent = data.date;
  const blurbEl = document.getElementById(id + '-blurb');
  if (blurbEl) blurbEl.textContent = data.blurb;
  const imgEl = document.getElementById(id + '-img');
  if (imgEl && data.imgAlt) imgEl.alt = data.imgAlt;
  const ul = document.getElementById(id + '-list');
  ul.innerHTML = '';
  data.li.forEach(function(text){
    const li = document.createElement('li');
    li.textContent = text;
    ul.appendChild(li);
  });
}

function fillEdu(id, data){
  document.getElementById(id + '-title').innerHTML = data.title;
  document.getElementById(id + '-place').textContent = data.place;
  document.getElementById(id + '-date').textContent = data.date;
  document.getElementById(id + '-detail').textContent = data.pre;
  document.getElementById(id + '-blurb').textContent = data.programBlurb;
  document.getElementById(id + '-thesis').innerHTML = data.thesisLabel + ' <em>' + data.thesis + '</em>';
  document.getElementById(id + '-abstract').textContent = data.abstract;
}

function fillList(id, items){
  const ul = document.getElementById(id + '-list');
  ul.innerHTML = '';
  items.forEach(function(text){
    const li = document.createElement('li');
    li.textContent = text;
    ul.appendChild(li);
  });
}

function fillLangs(langs){
  const items = document.querySelectorAll('#langs-list .lang');
  langs.forEach(function(l, i){
    items[i].querySelector('.lname').textContent = l.name;
    items[i].querySelector('.level').textContent = l.level;
  });
}

function fillSpecs(id, items){
  const ul = document.getElementById(id + '-list');
  ul.innerHTML = '';
  items.forEach(function(item){
    const li = document.createElement('li');
    li.className = 'spec-item';
    li.innerHTML =
      '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[item.icon] || '') + '</svg>' +
      '<div><h4>' + item.title + '</h4><p>' + item.desc + '</p></div>';
    ul.appendChild(li);
  });
}

function fillFest(id, data){
  document.getElementById(id + '-title').textContent = data.title;
  document.getElementById(id + '-place').textContent = data.place;
  document.getElementById(id + '-date').textContent = data.date;
  document.getElementById(id + '-desc').textContent = data.desc;
  document.getElementById(id + '-img').alt = data.alt;
}

document.querySelectorAll('.langbar button').forEach(function(btn){
  btn.addEventListener('click', function(){ applyLang(btn.dataset.lang); });
});

let initialLang = 'en';
try {
  const saved = localStorage.getItem('sb-lang');
  if (saved && T[saved]) initialLang = saved;
} catch(e){}
applyLang(initialLang);

document.querySelectorAll('.reveal').forEach(function(el, i){
  el.style.animationDelay = (i * 0.1) + 's';
});

const lightbox = document.getElementById('lightbox');
const lightboxImg = lightbox.querySelector('img');
let lightboxOpener = null;
function openLightbox(img){
  lightboxOpener = img;
  lightboxImg.src = img.src;
  lightboxImg.alt = img.alt;
  lightbox.classList.add('open');
  lightbox.focus();
}
function closeLightbox(){
  lightbox.classList.remove('open');
  if (lightboxOpener) { lightboxOpener.focus(); lightboxOpener = null; }
}
document.querySelectorAll('.fest-photo-wrap img').forEach(function(img){
  img.addEventListener('click', function(){ openLightbox(img); });
  img.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      openLightbox(img);
    }
  });
});
lightbox.addEventListener('click', closeLightbox);
lightbox.addEventListener('keydown', function(e){
  if (e.key === 'Escape') closeLightbox();
});

/* ---- Exclusive tabs: opening one closes the others ---- */
const tabButtons = Array.from(document.querySelectorAll('.tabbar button'));
const tabPanels = document.querySelectorAll('.tabpanel');
function activateTab(id, focusButton){
  tabButtons.forEach(function(b){
    const selected = b.dataset.tab === id;
    b.setAttribute('aria-selected', String(selected));
    b.setAttribute('tabindex', selected ? '0' : '-1');
    if (selected && focusButton) b.focus();
  });
  tabPanels.forEach(function(p){ p.classList.toggle('active', p.id === 'panel-' + id); });
}
tabButtons.forEach(function(btn){
  btn.addEventListener('click', function(){ activateTab(btn.dataset.tab); });
});
document.querySelector('.tabbar').addEventListener('keydown', function(e){
  const current = tabButtons.findIndex(function(b){ return b.getAttribute('aria-selected') === 'true'; });
  let next = null;
  if (e.key === 'ArrowRight') next = (current + 1) % tabButtons.length;
  else if (e.key === 'ArrowLeft') next = (current - 1 + tabButtons.length) % tabButtons.length;
  else if (e.key === 'Home') next = 0;
  else if (e.key === 'End') next = tabButtons.length - 1;
  if (next !== null){
    e.preventDefault();
    activateTab(tabButtons[next].dataset.tab, true);
  }
});
activateTab('experience');
