<style>
  :root{
    --canvas:#fef1ec;        /* blush paper */
    --ink:#11223f;           /* ink navy: all text */
    --ink-soft:#3b4a66;      /* secondary text (AA on canvas) */
    --accent:#ff5734;        /* coral: rules, borders, underlines, bullets */
    --accent-ink:#c4361a;    /* the same coral, darkened to pass AA where it sets text */
    --peach:#f6bba4;
    --line:#f2cfc2;          /* hairline: peach tint on canvas */
    --card:#ffffff;
    --pill:200px;
    --serif:"Cormorant Garamond", "Playfair Display", Georgia, serif;
    --sans:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --label:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  *{box-sizing:border-box;}
  button{text-align:inherit;}
  html{
    -webkit-text-size-adjust:100%;
    font-size:18px;
  }
  html[data-fontsize="large"]{font-size:20px;}
  html[data-fontsize="xlarge"]{font-size:23px;}

  body{
    margin:0;
    background:var(--canvas);
    color:var(--ink);
    font-family:var(--sans);
    font-size:1rem;
    font-weight:350;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }

  ::selection{background:var(--peach);}

  a{
    color:var(--ink);
    text-decoration:underline;
    text-decoration-color:var(--accent);
    text-decoration-thickness:1px;
    text-underline-offset:4px;
    transition:text-decoration-thickness .15s ease;
  }
  a:hover{text-decoration-thickness:2px;}
  a:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:2px;}

  .wrap{
    max-width:820px;
    margin:0 auto;
    padding:0 32px 40px;
  }

  /* ---- Language switcher ---- */
  .langbar{
    position:fixed;
    top:18px;
    right:18px;
    z-index:60;
    display:flex;
    align-items:center;
    gap:2px;
    background:rgba(254,241,236,.92);
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    border:1px solid var(--accent);
    border-radius:var(--pill);
    padding:3px 10px;
    font-family:var(--label);
  }
  .lang-group,.size-group{display:flex;align-items:center;gap:2px;}
  .langbar-divider{width:1px;height:14px;background:var(--line);margin:0 6px;flex-shrink:0;}
  .langbar button{
    appearance:none;
    border:none;
    background:transparent;
    font-family:inherit;
    font-size:.68rem;
    font-weight:500;
    letter-spacing:.14em;
    color:var(--ink-soft);
    padding:6px 7px;
    cursor:pointer;
    position:relative;
    transition:color .2s ease;
  }
  .langbar button:hover{color:var(--ink);}
  .langbar button.active{color:var(--ink);}
  .langbar button.active::after{
    content:"";
    position:absolute;left:7px;right:3px;bottom:2px;height:1px;background:var(--accent);
  }
  .size-btn{padding:6px 6px !important;line-height:1;}
  .size-group .size-btn:nth-child(1){font-size:.6rem;}
  .size-group .size-btn:nth-child(2){font-size:.76rem;}
  .size-group .size-btn:nth-child(3){font-size:.94rem;}
  .size-group .size-btn.active::after{left:5px;right:5px;}
  @media (max-width:600px){
    .langbar{top:12px;right:12px;}
    .langbar-divider{margin:0 3px;}
  }

  /* ---- Hero ---- */
  .band{
    position:relative;
    overflow:hidden;
    isolation:isolate;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:clamp(540px, 44vw, 580px);
    background:var(--canvas);
    color:var(--ink);
    text-align:center;
    padding:96px 32px 40px;
  }
  .band-inner{position:relative;z-index:1;width:100%;max-width:760px;margin:0 auto;}
  .band-main{display:flex;flex-direction:column;align-items:center;gap:30px;}

  /* Botanical frames: flat vector, bleeding off the top corners */
  .flora{
    position:absolute;
    top:0;
    z-index:0;
    width:clamp(190px, 31vw, 400px);
    height:auto;
    pointer-events:none;
  }
  .flora-l{left:0;}
  .flora-r{right:0;}

  .plate{margin:0;flex-shrink:0;text-align:center;}
  .plate img{
    width:148px;
    height:196px;
    object-fit:cover;
    object-position:center 22%;
    display:block;
    border-radius:var(--pill);
    outline:1px solid var(--accent);
    outline-offset:7px;
  }
  .plate figcaption{
    font-family:var(--label);
    font-size:.58rem;
    font-weight:500;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-top:20px;
  }

  .band-text{min-width:0;}

  .topline{
    font-family:var(--label);
    font-size:.7rem;
    font-weight:500;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--ink);
    margin:0 0 20px;
  }

  .name{
    font-family:var(--serif);
    font-weight:300;
    font-size:clamp(3.2rem, 11vw, 6.5rem);
    line-height:.92;
    letter-spacing:-.012em;
    word-spacing:.08em;
    margin:0;
    color:var(--ink);
    text-wrap:balance;
  }

  .role{
    font-family:var(--serif);
    font-style:italic;
    font-weight:400;
    font-size:clamp(1.25rem, 3.4vw, 1.7rem);
    line-height:1.3;
    color:var(--ink);
    margin:26px 0 0;
  }
  .role::before{
    content:"";
    display:block;
    width:56px;
    height:1px;
    background:var(--accent);
    margin:0 auto 22px;
  }

  /* ---- Lede (contacts + intro) ---- */
  .lede{padding:44px 0 0;text-align:center;}

  .contacts{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:12px 30px;
    margin:0;
    font-family:var(--label);
    font-size:.7rem;
    font-weight:500;
    letter-spacing:.14em;
    text-transform:uppercase;
  }
  .contacts span{color:var(--ink-soft);}

  .print-btn{
    appearance:none;
    border:1px solid var(--accent);
    border-radius:var(--pill);
    background:none;
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:7px 18px;
    font-family:var(--label);
    font-size:.64rem;
    font-weight:500;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--ink);
    cursor:pointer;
    transition:background-color .2s ease;
  }
  .print-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
  .print-btn:hover{background:var(--accent);}

  .intro{
    max-width:62ch;
    color:var(--ink);
    margin:38px auto 0;
    font-size:1.1rem;
    font-weight:300;
    line-height:1.8;
    text-align:left;
  }

  /* ---- Tabs ---- */
  .tabbar{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:6px 24px;
    margin-top:52px;
    border-bottom:1px solid var(--line);
    padding-top:10px;
    position:sticky;
    top:0;
    z-index:40;
    background:var(--canvas);
    transition:padding-top .25s ease;
  }
  @media (max-width:1399px){
    /* Once stuck, the tabs would otherwise sit directly under the
       fixed language/text-size pill — push them below it. */
    .tabbar.stuck{padding-top:54px;}
  }
  @media (min-width:900px){
    .tabbar{margin-left:-40px;margin-right:-40px;}
  }
  .tabbar button{
    appearance:none;
    border:none;
    background:none;
    text-align:left;
    font-family:var(--label);
    font-size:.7rem;
    font-weight:500;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    padding:10px 0 16px;
    cursor:pointer;
    position:relative;
    transition:color .2s ease;
  }
  .tabbar button::before{
    content:"§ ";
    color:var(--accent-ink);
  }
  .tabbar button:hover{color:var(--ink);}
  .tabbar button[aria-selected="true"]{color:var(--ink);}
  .tabbar button[aria-selected="true"]::after{
    content:"";
    position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);
  }
  @media (max-width:600px){
    .tabbar{gap:2px 20px;margin-top:40px;}
  }

  .tabpanel{
    display:none;
    padding-top:34px;
  }
  .tabpanel.active{
    display:block;
    animation:panelIn .35s ease;
  }
  @keyframes panelIn{
    from{opacity:0;transform:translateY(8px);}
    to{opacity:1;transform:none;}
  }

  .sub-label{
    font-family:var(--serif);
    font-size:1.65rem;
    letter-spacing:.07em;
    text-transform:uppercase;
    text-align:center;
    color:var(--ink);
    font-weight:400;
    line-height:1.2;
    margin:68px 0 36px;
  }
  .sub-label::after{
    content:"";
    display:block;
    width:44px;
    height:1px;
    background:var(--accent);
    margin:18px auto 0;
  }
  .sub-label:first-child{margin-top:0;}

  .entry{
    position:relative;
    display:grid;
    grid-template-columns:1fr auto;
    gap:4px 28px;
    padding-bottom:28px;
    margin-bottom:28px;
    border-bottom:1px solid var(--line);
  }
  .entry:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none;}
  .entry::before{
    content:"";
    position:absolute;
    left:-14px;
    top:0;
    bottom:0;
    width:3px;
    background:var(--accent);
    opacity:0;
    transition:opacity .2s ease;
  }
  .entry:hover::before{opacity:1;}
  @media (max-width:600px){
    .entry::before{left:-10px;}
  }

  .entry h3{
    font-family:var(--serif);
    font-size:1.6rem;
    font-weight:500;
    margin:0;
    line-height:1.2;
  }
  .entry .place{
    font-family:var(--serif);
    font-style:italic;
    color:var(--accent-ink);
    font-size:1.2rem;
    line-height:1.35;
    margin:5px 0 0;
  }
  .entry .date{
    font-family:var(--label);
    letter-spacing:.1em;
    color:var(--ink-soft);
    font-size:.74rem;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
    text-align:right;
    padding-top:9px;
  }
  .entry ul{
    grid-column:1 / -1;
    margin:14px 0 0;
    padding:0;
    list-style:none;
    color:var(--ink-soft);
  }
  .entry li{
    position:relative;
    padding-left:20px;
    margin-bottom:8px;
    font-size:.97rem;
  }
  .entry li::before{
    content:"";
    position:absolute;
    left:0;
    top:.7em;
    width:8px;
    height:1px;
    background:var(--accent);
  }
  .entry .detail{
    grid-column:1 / -1;
    margin:10px 0 0;
    color:var(--ink-soft);
    font-size:.97rem;
  }
  .entry .detail em{color:var(--ink);font-style:italic;}

  /* A note on the people in a photo (festival entries): same aside look as
     .workblurb. flow-root keeps its side rule from running under the floated photo. */
  .fest-entry .crew{
    display:flow-root;
    margin:12px 0 0;
    padding-left:14px;
    border-left:2px solid var(--accent);
    color:var(--ink-soft);
    font-family:var(--serif);
    font-style:italic;
    font-size:1.12rem;
    line-height:1.5;
  }
  .fest-entry .crew a{font-family:var(--sans);font-size:.92rem;font-style:normal;}
  .entry .workblurb{
    grid-column:1 / -1;
    margin:12px 0 0;
    padding-left:14px;
    border-left:2px solid var(--accent);
    color:var(--ink-soft);
    font-family:var(--serif);
    font-style:italic;
    font-size:1.12rem;
    line-height:1.5;
  }
  .entry .abstract{
    grid-column:1 / -1;
    margin:10px 0 0;
    color:var(--ink-soft);
    font-size:.94rem;
  }

  /* ---- Publications & conference talks ---- */
  .pub-list{list-style:none;margin:0;padding:0;}
  .pub-list li{
    padding-bottom:20px;
    margin-bottom:20px;
    border-bottom:1px solid var(--line);
  }
  .pub-list li:last-child{padding-bottom:0;margin-bottom:0;border-bottom:none;}
  .pub-title{
    display:block;
    font-family:var(--serif);
    font-style:italic;
    font-weight:500;
    font-size:1.32rem;
    line-height:1.3;
    color:var(--ink);
  }
  .pub-meta{
    display:block;
    font-family:var(--label);
    font-size:.66rem;
    font-weight:500;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-top:7px;
  }
  .pub-desc{
    margin:8px 0 0;
    color:var(--ink-soft);
    font-size:.92rem;
  }
  .pub-read{
    display:inline-block;
    margin-top:12px;
    font-family:var(--label);
    font-size:.64rem;
    font-weight:500;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--ink);
    text-decoration:none;
    border:1px solid var(--accent);
    border-radius:var(--pill);
    padding:5px 16px;
    transition:background-color .2s ease;
  }
  .pub-read:hover{background:var(--accent);text-decoration:none;}
  .pub-read::after{content:" ↓";content:" ↓" / "";}

  /* ---- Campus photo (Education tab) ---- */
  .campus-photo{margin:0 0 36px;}
  .campus-photo img{
    width:100%;
    height:auto;
    aspect-ratio:3 / 2;
    object-fit:cover;
    display:block;
    border:6px solid var(--card);
  }
  .campus-photo figcaption{
    font-family:var(--label);
    font-size:.64rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-top:9px;
    text-align:right;
  }

  /* ---- Experience entry with a photo ----
     The photo floats beside the text instead of sitting in a fixed-height
     flex column: once the text runs longer than the photo, it simply
     widens to fill the freed-up space instead of leaving a blank gap
     next to the tail end of the copy. ---- */
  .entry.has-photo{
    display:flow-root;
  }
  .entry.has-photo .fest-photo-wrap{
    float:left;
    width:168px;
    aspect-ratio:4 / 5;
    height:auto;
    margin:0 30px 16px 0;
  }
  .entry.has-photo .entry-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:16px;
    flex-wrap:wrap;
  }
  .entry.has-photo .entry-head h3{margin:0;}
  .entry.has-photo .entry-head .date{margin:0;padding-top:0;}
  .entry.has-photo .place{margin-top:4px;}
  /* .workblurb carries its own border-left/padding — a plain block box
     like that doesn't narrow around a float the way wrapped text does
     (only the text lines do), so left unguarded its left border cuts
     straight across the photo instead of starting beside it. Giving it
     its own block formatting context makes it dodge the float properly. */
  .entry.has-photo .workblurb{margin-top:14px;display:flow-root;}
  .entry.has-photo ul{margin-top:18px;display:flow-root;}
  @media (max-width:600px){
    .entry.has-photo .fest-photo-wrap{float:none;width:100%;max-width:220px;aspect-ratio:4/5;margin:0 0 20px;}
  }

  /* ---- Festival / photo cards ----
     Same reasoning as the has-photo entry above: the photo floats left,
     the title/date line and place/description text wrap beside it while
     short and widen to the full column once they run past the photo's
     bottom edge, so no blank strip is ever left dangling next to a long
     description. ---- */
  .fest-entry{
    display:flow-root;
  }
  .fest-photo-wrap{
    float:left;
    width:140px;
    height:140px;
    margin:0 24px 14px 0;
    cursor:zoom-in;
    overflow:hidden;
  }
  .fest-entry:nth-child(2) .fest-photo-wrap{--tilt:1.1deg;}
  .fest-entry:nth-child(3) .fest-photo-wrap{--tilt:-0.7deg;}
  .fest-entry:nth-child(4) .fest-photo-wrap{--tilt:0.8deg;}
  .fest-photo-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    border:6px solid var(--card);
    transform:rotate(var(--tilt,-1.1deg));
    transition:transform .3s ease;
  }
  .fest-photo-wrap:hover img{transform:rotate(0deg) scale(1.03);}
  .fest-photo-wrap img:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
  .fest-entry .fest-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:16px;
    flex-wrap:wrap;
  }
  .fest-entry .fest-title{font-family:var(--serif);font-size:1.6rem;font-weight:500;margin:0;line-height:1.2;}
  .fest-entry .date{margin:0;}
  .fest-entry .place{
    font-family:var(--label);
    font-size:.64rem;
    font-weight:500;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:12px 0 0;
  }
  .fest-entry .detail{margin-top:8px;}

  @media (max-width:600px){
    .fest-photo-wrap{float:none;width:100%;max-width:240px;height:auto;aspect-ratio:1/1;margin:0 auto 18px;}
    .fest-entry .date{text-align:left;margin-top:2px;}
  }

  /* ---- Unified photo colour grading: one warm, slightly muted grade
     across the profile, lecture, campus and festival photos so they
     read as one deliberate series despite different sources ---- */
  .plate img,
  .campus-photo img,
  .fest-photo-wrap img,
  .lightbox img{
    filter:sepia(.14) saturate(1.1) contrast(1.04) brightness(1);
  }

  /* ---- Lightbox ---- */
  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(17,34,63,.92);
    display:none;
    align-items:center;
    justify-content:center;
    padding:32px;
    z-index:200;
    cursor:zoom-out;
  }
  .lightbox.open{display:flex;}
  .lightbox img{
    max-width:92vw;
    max-height:88vh;
  }

  /* ---- Skills / interests spec grid ---- */
  .spec-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px;
    margin:0;
    padding:0;
    list-style:none;
  }
  .spec-item{
    display:flex;
    gap:16px;
    align-items:flex-start;
    background:var(--card);
    padding:26px 24px;
  }
  .spec-item svg{
    flex-shrink:0;
    width:30px;
    height:30px;
    margin-top:1px;
    stroke:var(--ink);
    fill:none;
    stroke-width:1.15;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .spec-grid.interests svg{stroke:var(--accent);}
  .spec-item h4{
    font-family:var(--serif);
    font-weight:500;
    font-size:1.28rem;
    margin:0;
    line-height:1.25;
  }
  .spec-item p{
    margin:6px 0 0;
    color:var(--ink-soft);
    font-size:.87rem;
    line-height:1.55;
  }
  @media (max-width:600px){
    .spec-grid{grid-template-columns:1fr;}
  }

  /* ---- Languages ---- */
  .langs{margin:0;padding:0;list-style:none;}
  .lang{
    display:grid;
    grid-template-columns:120px 1fr auto;
    align-items:center;
    gap:18px;
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .lang:last-child{border-bottom:none;}
  .lang .lname{font-family:var(--serif);font-weight:500;font-size:1.35rem;}
  .lang .level{font-family:var(--label);letter-spacing:.1em;color:var(--ink-soft);font-size:.74rem;white-space:nowrap;}
  .track{height:2px;background:var(--peach);position:relative;}
  .track i{position:absolute;left:0;top:0;height:100%;background:var(--accent);}

  /* ---- Back to top ---- */
  .back-to-top{
    position:fixed;
    right:20px;
    bottom:24px;
    z-index:60;
    width:40px;
    height:40px;
    border-radius:50%;
    appearance:none;
    border:1px solid var(--accent);
    background:var(--canvas);
    color:var(--ink);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transform:translateY(10px);
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease, background-color .2s ease;
  }
  .back-to-top.visible{
    opacity:1;
    transform:none;
    pointer-events:auto;
  }
  .back-to-top:hover{background:var(--accent);}
  .back-to-top svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .back-to-top:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
  @media (max-width:600px){
    .back-to-top{right:14px;bottom:16px;}
  }
  @media (prefers-reduced-motion:reduce){
    .back-to-top{transition:opacity .25s ease;}
  }

  /* ---- Footer ---- */
  footer{
    margin-top:72px;
    text-align:center;
    font-family:var(--label);
    font-size:.68rem;
    font-weight:500;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .flora-foot{
    display:block;
    width:min(100%, 900px);
    height:auto;
    margin:0 auto;
    pointer-events:none;
  }

  /* ---- Responsive ---- */
  @media (max-width:600px){
    .wrap{padding:0 22px 24px;}
    .intro{font-size:1rem;line-height:1.7;}
    .band{padding:84px 22px 28px;}
    .entry{grid-template-columns:1fr;}
    .entry .date{text-align:left;padding-top:2px;margin-bottom:8px;}
    .lang{grid-template-columns:96px 1fr;}
    .lang .level{grid-column:1 / -1;}
    .lang .track{grid-column:1 / -1;}
  }

  @media (prefers-reduced-motion:no-preference){
    .reveal{opacity:0;transform:translateY(12px);animation:rise .7s ease forwards;}
    @keyframes rise{to{opacity:1;transform:none;}}
  }

  .tabbar button:focus-visible,
  .langbar button:focus-visible{
    outline:2px solid var(--ink);
    outline-offset:2px;
  }

  /* ---- Print: condensed 1-2 page summary ---- */
  .print-note{display:none;}
  @media print{
    html{font-size:13px !important;}
    body{background:#fff;}
    .langbar,.tabbar,.lightbox,.print-btn,.back-to-top{display:none !important;}
    .wrap{padding:0 6px;max-width:100%;}

    /* Compact header — no photo, no coordinate line */
    .band{
      background:none !important;
      min-height:0 !important;
      display:block !important;
      text-align:left !important;
      color:var(--ink);
      padding:0 0 10px;
    }
    .flora,.flora-foot,.role::before,.sub-label::after{display:none !important;}
    .plate{display:none;}
    .name{font-weight:500 !important;}
    .contacts{justify-content:flex-start !important;}
    .lede{text-align:left !important;}
    .sub-label{text-align:left !important;}
    .spec-item{background:none !important;padding:0 !important;}
    .topline{display:none;}
    .name{font-size:1.65rem;color:var(--ink) !important;}
    .role{font-size:.92rem;margin-top:4px;color:var(--ink) !important;}

    .lede{padding-top:6px;}
    .name,.role{text-align:left !important;}
    .contacts{font-size:.76rem;gap:4px 16px;}
    .intro{font-size:.8rem;margin:8px 0 0;max-width:none;font-weight:400;}

    .tabpanel{display:block !important;animation:none !important;opacity:1 !important;transform:none !important;padding-top:8px;}
    .tabpanel + .tabpanel{margin-top:8px;border-top:1px solid var(--line);padding-top:8px;}

    /* Only Experience, Education, Skills & Languages make the cut —
       Festivals & Volunteering is the kind of thing worth a website,
       not a one-pager */
    #panel-festivals{display:none !important;}

    /* Photos, institutional asides, and long-form abstracts are for
       browsing, not skimming — trimmed here, full versions live on
       the site */
    .fest-photo-wrap,.campus-photo,.workblurb,.abstract{display:none !important;}
    .entry.has-photo{padding-left:0;}

    .sub-label{font-size:.78rem;letter-spacing:.1em;margin:10px 0 6px;}

    .entry{break-inside:avoid;padding-bottom:8px;margin-bottom:8px;font-size:.8rem;}
    .entry h3{font-size:.92rem;}
    .entry .place{font-size:.76rem;}
    .entry .date{font-size:.7rem;}
    .entry li{font-size:.76rem;margin-bottom:2px;}
    .entry .detail{font-size:.76rem;}

    /* Publications & talks — titles only, no venue/description, so
       the list stays a scan rather than a read */
    .pub-list .pub-meta,.pub-list .pub-desc,.pub-list .pub-read{display:none !important;}
    .pub-list li{padding-bottom:3px;margin-bottom:3px;}
    .pub-title{font-size:.78rem;}

    /* Skills — titles only, two columns */
    .spec-grid.skills{display:block;columns:2;column-gap:20px;}
    .spec-grid.skills .spec-item{display:block;margin-bottom:2px;break-inside:avoid;}
    .spec-grid.skills svg,.spec-grid.skills p{display:none;}
    .spec-item h4{font-size:.78rem;}

    /* Interests are personality, not qualifications — off the summary */
    #sub-interests,.spec-grid.interests{display:none !important;}

    .lang{padding:5px 0;font-size:.78rem;}

    .print-note{
      display:block;
      margin-top:14px;
      padding-top:8px;
      border-top:1px solid var(--line);
      font-family:var(--label);
      font-size:.66rem;
      color:var(--ink-soft);
    }
    footer{margin-top:12px;padding-top:8px;font-size:.6rem;}

    a{color:var(--ink);text-decoration:underline;}
  }
</style>
</head>

function applyLang(lang){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.getElementById('topline').textContent = t.topline;
  document.getElementById('name').textContent = t.name;
  document.getElementById('role').textContent = t.role;
  document.getElementById('intro').textContent = t.intro;
  document.getElementById('photo').alt = t.photoAlt;
  document.getElementById('plate-caption').textContent = t.plateCaption;
  document.getElementById('print-label').textContent = t.printLabel;
  document.getElementById('print-note').textContent = t.printNote;
  document.getElementById('back-to-top').setAttribute('aria-label', t.backToTop);

  document.getElementById('tab-experience').innerHTML = t.labels.experience;
  document.getElementById('tab-education').innerHTML = t.labels.education;
  document.getElementById('tab-skillslang').innerHTML = t.labels.skillslang;
  document.getElementById('tab-festivals').innerHTML = t.labels.festivals;

  document.getElementById('sub-activity').innerHTML = t.labels.activity;
  document.getElementById('sub-publications').innerHTML = t.labels.publications;
  document.getElementById('sub-talks').innerHTML = t.labels.talks;
  document.getElementById('sub-training').innerHTML = t.labels.training;
  document.getElementById('sub-skills').innerHTML = t.labels.skills;
  document.getElementById('sub-languages').innerHTML = t.labels.languages;
  document.getElementById('sub-interests').innerHTML = t.labels.interests;

  fillEntry('exp1', t.exp1);
  fillEntry('exp2', t.exp2);

  fillEdu('edu1', t.edu1);
  fillEdu('edu2', t.edu2);

  fillList('activity', t.activity);
  fillList('training', t.training);
  fillPubs('publications', t.publications, PUB_FILES, t.readPdf);
  fillPubs('talks', t.talks, TALK_FILES, t.viewSlides);
  document.getElementById('campus-img').alt = t.campusAlt;
  document.getElementById('campus-caption').textContent = t.campusCaption;

  fillLangs(t.langs);

  fillSpecs('skills', t.skills);
  fillSpecs('interests', t.interests);

  fillFest('festA', t.festA);
  fillFest('festB', t.festB);
  fillFest('festC', t.festC);
  fillFest('festD', t.festD);

  document.getElementById('footer-text').textContent = t.footer;

  document.querySelectorAll('.lang-group button').forEach(function(b){
    const isActive = b.dataset.lang === lang;
    b.classList.toggle('active', isActive);
    b.setAttribute('aria-pressed', String(isActive));
  });

  try { localStorage.setItem('sb-lang', lang); } catch(e){}
}

function fillEntry(id, data){
  document.getElementById(id + '-title').textContent = data.title.replace(/&rsquo;/g, '’');
  document.getElementById(id + '-place').textContent = data.place;
  document.getElementById(id + '-date').textContent = data.date;
  const blurbEl = document.getElementById(id + '-blurb');
  if (blurbEl) blurbEl.textContent = data.blurb;
  const imgEl = document.getElementById(id + '-img');
  if (imgEl && data.imgAlt) imgEl.alt = data.imgAlt;
  const ul = document.getElementById(id + '-list');
  ul.innerHTML = '';
  data.li.forEach(function(text){
    const li = document.createElement('li');
    li.textContent = text;
    ul.appendChild(li);
  });
}

function fillEdu(id, data){
  document.getElementById(id + '-title').innerHTML = data.title;
  document.getElementById(id + '-place').textContent = data.place;
  document.getElementById(id + '-date').textContent = data.date;
  document.getElementById(id + '-detail').textContent = data.pre;
  document.getElementById(id + '-blurb').textContent = data.programBlurb;
  document.getElementById(id + '-thesis').innerHTML = data.thesisLabel + ' <em>' + data.thesis + '</em>';
  document.getElementById(id + '-abstract').textContent = data.abstract;
}

function fillList(id, items){
  const ul = document.getElementById(id + '-list');
  ul.innerHTML = '';
  items.forEach(function(text){
    const li = document.createElement('li');
    li.textContent = text;
    ul.appendChild(li);
  });
}

/* The papers are the author's manuscripts, in Russian, one file per
   publication in the same order as T.*.publications. */
const PUB_FILES = [
  'assets/papers/byzov-place-of-writing-in-collaborative-learning.pdf',
  'assets/papers/byzov-digital-support-for-collaborative-writing.pdf',
  'assets/papers/byzov-intercultural-code-dream-of-the-rood.pdf',
  'assets/papers/byzov-assessment-of-collaborative-writing.pdf'
];
/* Slides, same order as T.*.talks; only the first talk has a file so far. */
const TALK_FILES = [
  'assets/papers/byzov-power-and-subordination-in-the-dream-of-the-rood-slides.pdf',
  null, null, null, null
];
function fillPubs(id, items, files, readLabel){
  const ul = document.getElementById(id + '-list');
  ul.innerHTML = '';
  items.forEach(function(item, i){
    const li = document.createElement('li');
    li.innerHTML =
      '<span class="pub-title">' + item.title + '</span>' +
      '<span class="pub-meta">' + item.meta + '</span>' +
      '<p class="pub-desc">' + item.desc + '</p>';
    if (files && files[i] && readLabel) {
      const a = document.createElement('a');
      a.className = 'pub-read';
      a.href = files[i];
      a.type = 'application/pdf';
      a.hreflang = 'ru';
      a.rel = 'noopener';
      a.textContent = readLabel;
      li.appendChild(a);
    }
    ul.appendChild(li);
  });
}

function fillLangs(langs){
  const items = document.querySelectorAll('#langs-list .lang');
  langs.forEach(function(l, i){
    items[i].querySelector('.lname').textContent = l.name;
    items[i].querySelector('.level').textContent = l.level;
  });
}

function fillSpecs(id, items){
  const ul = document.getElementById(id + '-list');
  ul.innerHTML = '';
  items.forEach(function(item){
    const li = document.createElement('li');
    li.className = 'spec-item';
    li.innerHTML =
      '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[item.icon] || '') + '</svg>' +
      '<div><h4>' + item.title + '</h4><p>' + item.desc + '</p></div>';
    ul.appendChild(li);
  });
}

/* A paragraph made of plain text and {a, href} link segments, so word order
   and grammar can differ per language. */
function renderSegments(el, segments){
  el.textContent = '';
  segments.forEach(function(seg){
    if (typeof seg === 'string') { el.appendChild(document.createTextNode(seg)); return; }
    const a = document.createElement('a');
    a.href = seg.href; a.textContent = seg.a; a.rel = 'noopener';
    el.appendChild(a);
  });
}
function fillFest(id, data){
  document.getElementById(id + '-title').textContent = data.title;
  document.getElementById(id + '-place').textContent = data.place;
  document.getElementById(id + '-date').textContent = data.date;
  document.getElementById(id + '-desc').textContent = data.desc;
  document.getElementById(id + '-img').alt = data.alt;
  const crewEl = document.getElementById(id + '-crew');
  if (crewEl && data.crew) renderSegments(crewEl, data.crew);
}

document.querySelectorAll('.lang-group button').forEach(function(btn){
  btn.addEventListener('click', function(){ applyLang(btn.dataset.lang); });
});

} catch(e){}
applyLang(initialLang);

/* ---- Text size (accessibility): normal / large / extra-large ---- */
const FONT_SIZES = ['normal', 'large', 'xlarge'];
function applyFontSize(size){
  document.documentElement.setAttribute('data-fontsize', size);
  document.querySelectorAll('.size-group button').forEach(function(b){
    const isActive = b.dataset.size === size;
    b.classList.toggle('active', isActive);
    b.setAttribute('aria-pressed', String(isActive));
  });
  try { localStorage.setItem('sb-fontsize', size); } catch(e){}
}
document.querySelectorAll('.size-group button').forEach(function(btn){
  btn.addEventListener('click', function(){ applyFontSize(btn.dataset.size); });
});
let initialFontSize = 'normal';
try {
  const savedSize = localStorage.getItem('sb-fontsize');
  if (savedSize && FONT_SIZES.includes(savedSize)) initialFontSize = savedSize;
} catch(e){}
applyFontSize(initialFontSize);

document.querySelectorAll('.reveal').forEach(function(el, i){
  el.style.animationDelay = (i * 0.1) + 's';
});

const lightbox = document.getElementById('lightbox');
const lightboxImg = lightbox.querySelector('img');
let lightboxOpener = null;
function openLightbox(img){
  lightboxOpener = img;
  lightboxImg.src = img.src;
  lightboxImg.alt = img.alt;
  lightbox.classList.add('open');
  lightbox.focus();
}
function closeLightbox(){
  lightbox.classList.remove('open');
  if (lightboxOpener) { lightboxOpener.focus(); lightboxOpener = null; }
}
document.querySelectorAll('.fest-photo-wrap img').forEach(function(img){
  img.addEventListener('click', function(){ openLightbox(img); });
  img.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      openLightbox(img);
    }
  });
});
lightbox.addEventListener('click', closeLightbox);
lightbox.addEventListener('keydown', function(e){
  if (e.key === 'Escape') closeLightbox();
});

/* ---- Exclusive tabs: opening one closes the others ---- */
const tabButtons = Array.from(document.querySelectorAll('.tabbar button'));
const tabPanels = document.querySelectorAll('.tabpanel');
function activateTab(id, focusButton){
  tabButtons.forEach(function(b){
    const selected = b.dataset.tab === id;
    b.setAttribute('aria-selected', String(selected));
    b.setAttribute('tabindex', selected ? '0' : '-1');
    if (selected && focusButton) b.focus();
  });
  tabPanels.forEach(function(p){ p.classList.toggle('active', p.id === 'panel-' + id); });
}
tabButtons.forEach(function(btn){
  btn.addEventListener('click', function(){ activateTab(btn.dataset.tab); });
});
document.querySelector('.tabbar').addEventListener('keydown', function(e){
  const current = tabButtons.findIndex(function(b){ return b.getAttribute('aria-selected') === 'true'; });
  let next = null;
  if (e.key === 'ArrowRight') next = (current + 1) % tabButtons.length;
  else if (e.key === 'ArrowLeft') next = (current - 1 + tabButtons.length) % tabButtons.length;
  else if (e.key === 'Home') next = 0;
  else if (e.key === 'End') next = tabButtons.length - 1;
  if (next !== null){
    e.preventDefault();
    activateTab(tabButtons[next].dataset.tab, true);
  }
});
activateTab('experience');

/* ---- Sticky tabbar shadow + back-to-top button ---- */
const tabbarEl = document.querySelector('.tabbar');
const backToTopBtn = document.getElementById('back-to-top');
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function onScroll(){
  tabbarEl.classList.toggle('stuck', tabbarEl.getBoundingClientRect().top <= 0);
  backToTopBtn.classList.toggle('visible', window.scrollY > 480);
}
window.addEventListener('scroll', onScroll, { passive: true });
onScroll();
backToTopBtn.addEventListener('click', function(){
  window.scrollTo({ top: 0, behavior: prefersReducedMotion ? 'auto' : 'smooth' });
});
