    --bg-soft:#DCE9F5;
    --ink:#152433;
    --muted:#4D6275;
    --faint:#7B8EA0;
    --hair:#C5D7E8;
    --accent:#236A93;
    --accent-warm:#B8622E;
    --card:#ffffff;
    --serif:"Instrument Serif", Georgia, serif;
    --sans:"Inter", system-ui, -apple-system, sans-serif;
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  ::selection{background:#C7DCEE;}

  a{color:var(--accent);text-decoration:none;}
  a:hover{text-decoration:underline;text-underline-offset:3px;}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px;}

  .wrap{
    max-width:820px;
    margin:0 auto;
    padding:88px 32px 120px;
  }

  /* ---- Language switcher ---- */
  .langbar{
    position:fixed;
    top:22px;
    right:22px;
    z-index:60;
    display:flex;
    gap:4px;
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(8px);
    border:1px solid var(--hair);
    border-radius:999px;
    padding:4px;
    box-shadow:0 4px 18px rgba(20,50,80,.1);
  }
  .langbar button{
    appearance:none;
    border:none;
    background:transparent;
    font-family:var(--sans);
    font-size:.76rem;
    font-weight:600;
    letter-spacing:.04em;
    color:var(--faint);
    padding:7px 13px;
    border-radius:999px;
    cursor:pointer;
    transition:background .2s ease, color .2s ease;
  }
  .langbar button:hover{color:var(--accent);}
  .langbar button.active{
    background:var(--accent);
    color:#fff;
  }
  @media (max-width:600px){
    .langbar{top:14px;right:14px;}
    .langbar button{padding:6px 10px;font-size:.7rem;}
  }

  /* ---- Header ---- */
  .head{
    display:flex;
    align-items:center;
    gap:36px;
    margin-bottom:8px;
  }
  .head-text{flex:1;min-width:0;}

  .topline{
    font-size:.72rem;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--faint);
    margin:0 0 18px;
  }

  .name{
    font-family:var(--serif);
    font-weight:400;
    font-size:clamp(2.8rem, 8vw, 4.6rem);
    line-height:1.02;
    letter-spacing:-.01em;
    margin:0;
  }

  .role{
    font-family:var(--serif);
    font-style:italic;
    font-size:clamp(1.2rem, 4vw, 1.55rem);
    color:var(--accent);
    margin:12px 0 0;
  }

  .photo{
    width:148px;
    height:148px;
    border-radius:50%;
    object-fit:cover;
    flex-shrink:0;
    box-shadow:0 6px 28px rgba(20,50,80,.18);
    outline:4px solid rgba(255,255,255,.65);
  }

  .contacts{
    display:flex;
    flex-wrap:wrap;
    gap:10px 24px;
    margin:30px 0 0;
    font-size:.92rem;
  }
  .contacts span{color:var(--faint);}

  .intro{
    max-width:62ch;
    color:var(--muted);
    margin:30px 0 0;
    font-size:1.05rem;
  }

  /* ---- Tabs ---- */
  .tabbar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:48px;
    border-top:1px solid var(--hair);
    padding-top:28px;
  }
  .tabbar button{
    appearance:none;
    border:1px solid var(--hair);
    background:rgba(255,255,255,.55);
    border-radius:999px;
    padding:9px 18px;
    font-family:var(--sans);
    font-size:.74rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    font-weight:600;
    color:var(--muted);
    cursor:pointer;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .tabbar button:hover{color:var(--accent);}
  .tabbar button[aria-selected="true"]{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  @media (max-width:600px){
    .tabbar{gap:6px;padding-top:22px;}
    .tabbar button{padding:8px 14px;font-size:.68rem;}
  }

  .tabpanel{
    display:none;
    padding-top:36px;
  }
  .tabpanel.active{
    display:block;
    animation:panelIn .35s ease;
  }
  @keyframes panelIn{
    from{opacity:0;transform:translateY(8px);}
    to{opacity:1;transform:none;}
  }

  .sub-label{
    font-size:.68rem;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--faint);
    font-weight:600;
    margin:36px 0 22px;
  }
  .sub-label:first-child{margin-top:0;}

  .entry{
    display:grid;
    grid-template-columns:1fr auto;
    gap:4px 28px;
    margin-bottom:32px;
    padding:14px;
    margin-left:-14px;
    margin-right:-14px;
    border-radius:14px;
  }
  .entry:last-child{margin-bottom:0;}

  .entry h3{
    font-size:1.1rem;
    font-weight:600;
    margin:0;
    line-height:1.35;
  }
  .entry .place{
    color:var(--accent);
    font-size:.95rem;
    margin:2px 0 0;
  }
  .entry .date{
    color:var(--faint);
    font-size:.85rem;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
    text-align:right;
    padding-top:4px;
  }
  .entry ul{
    grid-column:1 / -1;
    margin:12px 0 0;
    padding:0;
    list-style:none;
    color:var(--muted);
  }
  .entry li{
    position:relative;
    padding-left:20px;
    margin-bottom:7px;
    font-size:.96rem;
  }
  .entry li::before{
    content:"";
    position:absolute;
    left:0;
    top:.7em;
    width:8px;
    height:1px;
    background:var(--accent);
  }
  .entry .detail{
    grid-column:1 / -1;
    margin:8px 0 0;
    color:var(--muted);
    font-size:.96rem;
  }
  .entry .detail em{color:var(--ink);font-style:italic;}

  /* ---- Festival / photo cards ---- */
  .fest-entry{
    display:grid;
    grid-template-columns:132px 1fr auto;
    grid-template-areas:
      "photo title date"
      "photo desc desc";
    gap:4px 24px;
    align-items:start;
  }
  .fest-photo-wrap{
    grid-area:photo;
    width:132px;
    height:132px;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 16px rgba(20,50,80,.14);
    cursor:zoom-in;
    flex-shrink:0;
  }
  .fest-photo-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform .5s ease;
  }
  .fest-photo-wrap:hover img{transform:scale(1.08);}
  .fest-entry .head-block{grid-area:title;}
  .fest-entry .date{grid-area:date;}
  .fest-entry .detail{grid-area:desc;margin-top:8px;}

  @media (max-width:600px){
    .fest-entry{
      grid-template-columns:88px 1fr;
      grid-template-areas:
        "photo title"
        "desc desc";
    }
    .fest-entry .date{grid-column:2;grid-row:1;text-align:left;}
    .fest-photo-wrap{width:88px;height:88px;}
  }

    position:fixed;
    inset:0;
    background:rgba(10,20,32,.86);
    display:none;
    align-items:center;
    justify-content:center;
    padding:32px;
    z-index:200;
    cursor:zoom-out;

  .lightbox img{
    max-width:92vw;
    max-height:88vh;
    border-radius:10px;
    box-shadow:0 24px 70px rgba(0,0,0,.5);
  }

  .tags{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin:0;
    padding:0;
    list-style:none;

    border:1px solid var(--hair);
    border-radius:999px;
    padding:7px 16px;
    font-size:.9rem;
    color:var(--ink);
    background:rgba(255,255,255,.5);
    transition:background .2s ease, border-color .2s ease, transform .2s ease, color .2s ease;
    cursor:default;
  }
  .tags li:hover{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    transform:translateY(-2px);
  }
  .tags.interests li:hover{
    background:var(--accent-warm);
    border-color:var(--accent-warm);
  }

  /* ---- Languages ---- */
  .langs{margin:0;padding:0;list-style:none;}
  .lang{
    display:grid;
    grid-template-columns:120px 1fr auto;
    align-items:center;
    gap:18px;
    padding:14px 0;
    border-bottom:1px solid var(--hair);
  }
  .lang:last-child{border-bottom:none;}
  .lang .lname{font-weight:600;font-size:1rem;}
  .lang .level{color:var(--muted);font-size:.88rem;white-space:nowrap;}
  .track{height:2px;background:var(--hair);position:relative;border-radius:2px;}
  .track i{position:absolute;left:0;top:0;height:100%;background:var(--accent);border-radius:2px;}

  /* ---- Footer ---- */

    margin-top:56px;
    border-top:1px solid var(--hair);
    padding-top:30px;
    font-size:.85rem;
    color:var(--faint);
  }

  /* ---- Responsive ---- */
  @media (max-width:600px){
    .wrap{padding:56px 22px 80px;}

    .lang{grid-template-columns:96px 1fr;}
    .lang .level{grid-column:1 / -1;}
    .lang .track{grid-column:1 / -1;}
  }

  @media (prefers-reduced-motion:no-preference){
    .reveal{opacity:0;transform:translateY(12px);animation:rise .7s ease forwards;}
    @keyframes rise{to{opacity:1;transform:none;}}

</style>

function applyLang(lang){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.getElementById('topline').textContent = t.topline;
  document.getElementById('name').textContent = t.name;
  document.getElementById('role').textContent = t.role;
  document.getElementById('intro').textContent = t.intro;

  document.getElementById('tab-experience').innerHTML = t.labels.experience;
  document.getElementById('tab-education').innerHTML = t.labels.education;
  document.getElementById('tab-skillslang').innerHTML = t.labels.skillslang;
  document.getElementById('tab-festivals').innerHTML = t.labels.festivals;

  document.getElementById('sub-activity').innerHTML = t.labels.activity;
  document.getElementById('sub-skills').innerHTML = t.labels.skills;
  document.getElementById('sub-languages').innerHTML = t.labels.languages;
  document.getElementById('sub-interests').innerHTML = t.labels.interests;

  fillEntry('exp1', t.exp1);
  fillEntry('exp2', t.exp2);

  fillEdu('edu1', t.edu1);
  fillEdu('edu2', t.edu2);

  fillList('activity', t.activity);

  fillLangs(t.langs);

  fillTags('skills', t.skills);
  fillTags('interests', t.interests);

  fillFest('festA', t.festA);
  fillFest('festB', t.festB);
  fillFest('festC', t.festC);

  document.getElementById('footer-text').textContent = t.footer;

  document.querySelectorAll('.langbar button').forEach(function(b){
    b.classList.toggle('active', b.dataset.lang === lang);
  });

  try { localStorage.setItem('sb-lang', lang); } catch(e){}
}

function fillEntry(id, data){
  document.getElementById(id + '-title').textContent = data.title.replace(/&rsquo;/g, '\u2019');
  document.getElementById(id + '-place').textContent = data.place;
  document.getElementById(id + '-date').textContent = data.date;
  const ul = document.getElementById(id + '-list');
  ul.innerHTML = '';
  data.li.forEach(function(text){
    const li = document.createElement('li');
    li.textContent = text;
    ul.appendChild(li);
  });
}

function fillEdu(id, data){
  document.getElementById(id + '-title').innerHTML = data.title;
  document.getElementById(id + '-place').textContent = data.place;
  document.getElementById(id + '-date').textContent = data.date;
  document.getElementById(id + '-detail').innerHTML =
    data.pre + '<br>' + data.thesisLabel + ' <em>' + data.thesis + '</em>';
}

function fillList(id, items){
  const ul = document.getElementById(id + '-list');
  ul.innerHTML = '';
  items.forEach(function(text){
    const li = document.createElement('li');
    li.textContent = text;
    ul.appendChild(li);
  });
}

function fillLangs(langs){
  const items = document.querySelectorAll('#langs-list .lang');
  langs.forEach(function(l, i){
    items[i].querySelector('.lname').textContent = l.name;
    items[i].querySelector('.level').textContent = l.level;
  });
}

function fillTags(id, items){
  const ul = document.getElementById(id + '-list');
  ul.innerHTML = '';
  items.forEach(function(text){
    const li = document.createElement('li');
    li.innerHTML = text;
    ul.appendChild(li);
  });
}

function fillFest(id, data){
  document.getElementById(id + '-title').textContent = data.title;
  document.getElementById(id + '-place').textContent = data.place;
  document.getElementById(id + '-date').textContent = data.date;
  document.getElementById(id + '-desc').textContent = data.desc;
  document.getElementById(id + '-img').alt = data.alt;
}

document.querySelectorAll('.langbar button').forEach(function(btn){
  btn.addEventListener('click', function(){ applyLang(btn.dataset.lang); });
});

let initialLang = 'en';
try {
  const saved = localStorage.getItem('sb-lang');
  if (saved && T[saved]) initialLang = saved;
} catch(e){}
applyLang(initialLang);

document.querySelectorAll('.reveal').forEach(function(el, i){
  el.style.animationDelay = (i * 0.1) + 's';
});

const lightbox = document.getElementById('lightbox');
const lightboxImg = lightbox.querySelector('img');
document.querySelectorAll('.fest-photo-wrap img').forEach(function(img){
  img.addEventListener('click', function(){
    lightboxImg.src = img.src;
    lightboxImg.alt = img.alt;
    lightbox.classList.add('open');
  });
});
lightbox.addEventListener('click', function(){ lightbox.classList.remove('open'); });

/* ---- Exclusive tabs: opening one closes the others ---- */
const tabButtons = document.querySelectorAll('.tabbar button');
const tabPanels = document.querySelectorAll('.tabpanel');
function activateTab(id){
  tabButtons.forEach(function(b){ b.setAttribute('aria-selected', String(b.dataset.tab === id)); });
  tabPanels.forEach(function(p){ p.classList.toggle('active', p.id === 'panel-' + id); });
}
tabButtons.forEach(function(btn){
  btn.addEventListener('click', function(){ activateTab(btn.dataset.tab); });
});
activateTab('experience');
